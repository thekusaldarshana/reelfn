name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please **never paste your API key or the contents of `.env`**.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run or ask your AI agent to do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the last 20-30 lines of the terminal output.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI agent (if any)
      placeholder: Claude Code, Codex, Cursor, Gemini CLI, none...
